<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no" />

<title>ネズミ回避ゲーム</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
}

body{
  overflow:hidden;
  background:linear-gradient(#87ceeb,#dff6ff);
  font-family:sans-serif;

  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

canvas{
  width:100vw;
  height:100vh;
  display:block;
  background:#dff6ff;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

/* ===== タイトル画面 ===== */

#startScreen{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(
    rgba(135,206,235,0.9),
    rgba(223,246,255,0.95)
  );

  z-index:10;

  pointer-events:auto;
}

#gameTitle{

  font-size:52px;
  font-weight:bold;

  color:white;

  text-shadow:
    4px 4px 0 #5c3a1e,
    8px 8px 12px rgba(0,0,0,0.3);

  margin-bottom:40px;
}

#startButton{

  padding:18px 42px;

  font-size:30px;
  font-weight:bold;

  border:none;

  border-radius:18px;

  background:#ffcc66;

  color:#5c3a1e;

  box-shadow:
    0 8px 0 #d9982f,
    0 12px 20px rgba(0,0,0,0.25);

  pointer-events:auto;
}

#startButton:active{

  transform:translateY(4px);

  box-shadow:
    0 4px 0 #d9982f,
    0 6px 12px rgba(0,0,0,0.25);
}

/* ===== 操作UI ===== */

#controls{
  position:absolute;
  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:260px;
  height:260px;

  pointer-events:auto;
}

.btn{
  position:absolute;

  width:80px;
  height:80px;

  border-radius:50%;

  background:rgba(255,255,255,0.35);

  border:4px solid white;

  color:white;

  font-size:30px;
  font-weight:bold;

  display:flex;
  justify-content:center;
  align-items:center;

  backdrop-filter:blur(6px);

  pointer-events:auto;
}

#leftBtn{
  left:0;
  top:90px;
}

#rightBtn{
  right:0;
  top:90px;
}

#jumpBtn{
  left:90px;
  top:0;

  background:rgba(255,180,0,0.5);
}

#crouchBtn{
  left:90px;
  bottom:0;

  background:rgba(0,180,255,0.5);
}

#restart{
  position:absolute;

  left:50%;
  top:60%;

  transform:translateX(-50%);

  padding:14px 28px;

  font-size:22px;

  border:none;

  border-radius:14px;

  background:white;

  display:none;

  pointer-events:auto;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <!-- タイトル画面 -->
  <div id="startScreen">

    <div id="gameTitle">
      ネズミ回避ゲーム
    </div>

    <button id="startButton">
      START
    </button>

  </div>

  <!-- 操作UI -->
  <div id="controls">

    <div class="btn" id="leftBtn">◀</div>
    <div class="btn" id="rightBtn">▶</div>

    <div class="btn" id="jumpBtn">⬆</div>
    <div class="btn" id="crouchBtn">⬇</div>

  </div>

  <button id="restart">
    RESTART
  </button>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

// ===== タイトル画面 =====

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

let gameStarted = false;

startButton.onclick = ()=>{

  gameStarted = true;

  startScreen.style.display = "none";
};

// ===== リサイズ =====

let groundY =
innerHeight - 180;

function resizeGame(){

  canvas.width = innerWidth;
  canvas.height = innerHeight;

  groundY =
  canvas.height - 180;

  player.y =
  Math.min(player.y,groundY);
}

// ===== プレイヤー =====

const player = {

  x: innerWidth / 2 - 20,
  y: groundY,

  w:60,
  h:60,

  vy:0,

  speed:6,

  gravity:0.8,

  jumpPower:-16,

  onGround:true,

  isCrouching:false
};

// ===== 入力 =====

const keys = {

  left:false,
  right:false,
  jump:false,
  crouch:false
};

function bindButton(id,key){

  const btn =
  document.getElementById(id);

  const start = (e)=>{

    e.preventDefault();

    keys[key] = true;
  };

  const end = (e)=>{

    e.preventDefault();

    keys[key] = false;
  };

  btn.addEventListener(
    "touchstart",
    start,
    {passive:false}
  );

  btn.addEventListener(
    "touchend",
    end,
    {passive:false}
  );

  btn.addEventListener(
    "touchcancel",
    end,
    {passive:false}
  );

  btn.addEventListener(
    "mousedown",
    start
  );

  btn.addEventListener(
    "mouseup",
    end
  );

  btn.addEventListener(
    "mouseleave",
    end
  );
}

bindButton("leftBtn","left");
bindButton("rightBtn","right");
bindButton("jumpBtn","jump");
bindButton("crouchBtn","crouch");

// ===== 障害物 =====

let obstacles = [];

let frame = 0;

let score = 0;

let gameOver = false;

function spawnObstacle(){

  const r = Math.random();

  let type =
    r < 0.33
    ? "wall"
    : r < 0.66
    ? "baran"
    : "fence";

  let obj = {

    type,

    y:-100,

    speed:4 + score * 0.005
  };

  if(type==="wall"){

    obj.w = 90;
    obj.h = 90;
  }

  if(type==="baran"){

    obj.w = 120;
    obj.h = 30;
  }

  if(type==="fence"){

    obj.w = 120;
    obj.h = 25;
  }

  obj.x =
  Math.random() *
  (canvas.width - obj.w);

  obstacles.push(obj);
}

function isColliding(a,b){

  return(

    a.x < b.x + b.w &&
    a.x + a.w > b.x &&

    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

// ===== リスタート =====

const restartBtn =
document.getElementById("restart");

function resetGame(){

  obstacles = [];

  frame = 0;

  score = 0;

  gameOver = false;

  player.x =
  canvas.width / 2 - 20;

  player.y = groundY;

  player.vy = 0;

  player.onGround = true;

  restartBtn.style.display =
  "none";
}

restartBtn.onclick = resetGame;

// ===== 更新 =====

function update(){

  if(!gameStarted) return;

  if(gameOver) return;

  frame++;

  score++;

  if(keys.left){
    player.x -= player.speed;
  }

  if(keys.right){
    player.x += player.speed;
  }

  if(keys.jump && player.onGround){

    player.vy =
    player.jumpPower;

    player.onGround = false;
  }

  if(keys.crouch){

    if(!player.isCrouching){

      player.h = 35;

      player.y += 25;
    }

    player.isCrouching = true;

  }else{

    if(player.isCrouching){

      player.h = 60;

      player.y -= 25;
    }

    player.isCrouching = false;
  }

  player.vy += player.gravity;

  player.y += player.vy;

  if(player.y >= groundY){

    player.y = groundY;

    player.vy = 0;

    player.onGround = true;
  }

  player.x = Math.max(
    0,
    Math.min(
      canvas.width-player.w,
      player.x
    )
  );

  if(frame % 55 === 0){
    spawnObstacle();
  }

  obstacles.forEach(obj=>{

    obj.y += obj.speed;

    if(isColliding(player,obj)){

      let correct = false;

      if(obj.type==="wall"){
        gameOver = true;
      }

      if(obj.type==="baran"){
        correct = !player.onGround;
      }

      if(obj.type==="fence"){
        correct = player.isCrouching;
      }

      if(
        obj.type!=="wall"
        &&
        !correct
      ){
        gameOver = true;
      }
    }
  });

  obstacles =
  obstacles.filter(
    o => o.y < canvas.height + 100
  );

  if(gameOver){
    restartBtn.style.display =
    "block";
  }
}

// ===== ネズミ描画 =====

function drawPlayer(){

  const x = player.x;
  const y = player.y;

  ctx.strokeStyle = "#8b5a2b";
  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(x + 12, y + 38);

  ctx.quadraticCurveTo(
    x - 35,
    y + 20,
    x - 5,
    y + 60
  );

  ctx.stroke();

  ctx.strokeStyle = "#5c3a1e";
  ctx.lineWidth = 6;

  ctx.beginPath();

  ctx.moveTo(x + 20, y + 42);
  ctx.lineTo(x + 15, y + 52);

  ctx.moveTo(x + 38, y + 42);
  ctx.lineTo(x + 43, y + 52);

  ctx.stroke();

  ctx.fillStyle = "#9b6a43";

  ctx.beginPath();

  ctx.ellipse(
    x + 28,
    y + 28,
    24,
    20,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    x + 28,
    y + 12,
    16,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle = "#8b5a2b";

  ctx.beginPath();

  ctx.arc(x + 16,y + 2,9,0,Math.PI*2);
  ctx.arc(x + 40,y + 2,9,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle = "#ffb6c1";

  ctx.beginPath();

  ctx.arc(x + 16,y + 2,4,0,Math.PI*2);
  ctx.arc(x + 40,y + 2,4,0,Math.PI*2);

  ctx.fill();
}

// ===== 障害物描画 =====

function drawOutlineRect(
  x,y,w,h,color
){

  ctx.fillStyle = color;

  ctx.strokeStyle = "#000";

  ctx.lineWidth = 4;

  ctx.fillRect(x,y,w,h);

  ctx.strokeRect(x,y,w,h);
}

function drawWall(x,y,w,h){

  drawOutlineRect(
    x,y,w,h,
    "#ff6b6b"
  );
}

function drawBaran(x,y,w,h){

  ctx.fillStyle="#2ecc71";
  ctx.strokeStyle="#000";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(x,y+h);

  for(let i=0;i<w;i+=12){

    ctx.lineTo(
      x+i,
      y+(i%24===0?0:h)
    );
  }

  ctx.lineTo(x+w,y+h);

  ctx.closePath();

  ctx.fill();
  ctx.stroke();
}

function drawFence(x,y,w,h){

  drawOutlineRect(
    x,y,w,h,
    "#c8a97e"
  );

  for(let i=0;i<w;i+=22){

    drawOutlineRect(
      x+i,
      y-20,
      7,
      45,
      "#a67c52"
    );
  }
}

// ===== 描画 =====

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const sky =
  ctx.createLinearGradient(
    0,
    0,
    0,
    canvas.height
  );

  sky.addColorStop(
    0,
    "#bde0fe"
  );

  sky.addColorStop(
    1,
    "#dff6ff"
  );

  ctx.fillStyle = sky;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle = "#8ecae6";

  ctx.fillRect(
    0,
    groundY + 45,
    canvas.width,
    180
  );

  obstacles.forEach(obj=>{

    if(obj.type==="wall"){
      drawWall(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );
    }

    if(obj.type==="baran"){
      drawBaran(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );
    }

    if(obj.type==="fence"){
      drawFence(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );
    }
  });

  drawPlayer();

  ctx.fillStyle = "#000";

  ctx.font =
  "bold 32px sans-serif";

  ctx.fillText(
    "SCORE: " + score,
    20,
    50
  );

  if(gameOver){

    ctx.fillStyle =
    "rgba(0,0,0,0.5)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "white";

    ctx.font =
    "bold 56px sans-serif";

    ctx.textAlign = "center";

    ctx.fillText(
      "GAME OVER",
      canvas.width/2,
      canvas.height/2
    );
  }
}

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);
}

resizeGame();

loop();

addEventListener(
  "resize",
  resizeGame
);

</script>

</body>
</html>
